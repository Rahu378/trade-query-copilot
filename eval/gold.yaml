  question: How many open breaks are there?
  sql: |
    SELECT COUNT(*) FROM TRADE_OPS.CORE.FACT_BREAKS WHERE break_status IN ('OPEN', 'INVESTIGATING')

- id: G32
  category: breaks
  question: Open breaks by owner team
  sql: |
