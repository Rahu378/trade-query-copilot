- id: G13
  category: activity
  question: Top 5 counterparties by notional traded this month
  sql: |
    SELECT c.counterparty_name, SUM(t.notional_usd) AS notional
    FROM TRADE_OPS.CORE.FACT_TRADES t JOIN TRADE_OPS.CORE.DIM_COUNTERPARTY c ON c.counterparty_id = t.counterparty_id
    WHERE t.trade_date BETWEEN '2026-11-01' AND '2026-11-20' AND t.trade_status <> 'CANCELLED'
    GROUP BY c.counterparty_name ORDER BY notional DESC LIMIT 5

- id: G14
  category: activity
  question: How many trades were cancelled last week?
  sql: |
    SELECT COUNT(*) FROM TRADE_OPS.CORE.FACT_TRADES
    WHERE trade_status = 'CANCELLED' AND trade_date BETWEEN '2026-11-09' AND '2026-11-13'

- id: G15
  category: activity
  question: Daily trade count for the last 5 business days
  sql: |
    SELECT trade_date, COUNT(*) FROM TRADE_OPS.CORE.FACT_TRADES
    WHERE trade_date BETWEEN '2026-11-16' AND '2026-11-20' AND trade_status <> 'CANCELLED'
