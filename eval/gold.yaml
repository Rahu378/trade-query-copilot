- id: G20
  category: activity
  question: How much did US Large Cap Core buy in AAPL this month?
  sql: |
    SELECT SUM(t.notional_usd)
    FROM TRADE_OPS.CORE.FACT_TRADES t
    JOIN TRADE_OPS.CORE.DIM_ACCOUNT a ON a.account_id = t.account_id
    JOIN TRADE_OPS.CORE.DIM_SECURITY x ON x.security_id = t.security_id
    WHERE a.account_name = 'US Large Cap Core' AND x.ticker = 'AAPL' AND t.side = 'BUY'
      AND t.trade_date BETWEEN '2026-11-01' AND '2026-11-20' AND t.trade_status <> 'CANCELLED'

- id: G21
  category: positions
  question: What is the base-currency market value by account?
  sql: |
    SELECT a.account_name, SUM(p.market_value_usd)
    FROM TRADE_OPS.CORE.FACT_POSITIONS p JOIN TRADE_OPS.CORE.DIM_ACCOUNT a ON a.account_id = p.account_id
    WHERE p.as_of_date = '2026-11-20'
    GROUP BY a.account_name

- id: G22
  category: positions
  question: Which positions have traded quantity different from settled quantity?
  sql: |
    SELECT a.account_name, x.ticker
    FROM TRADE_OPS.CORE.FACT_POSITIONS p
    JOIN TRADE_OPS.CORE.DIM_ACCOUNT a ON a.account_id = p.account_id
    JOIN TRADE_OPS.CORE.DIM_SECURITY x ON x.security_id = p.security_id
    WHERE p.as_of_date = '2026-11-20' AND p.traded_quantity <> p.settled_quantity

- id: G23
  category: positions
  question: Total unsettled quantity by security
  sql: |
    SELECT x.ticker, SUM(p.traded_quantity - p.settled_quantity)
    FROM TRADE_OPS.CORE.FACT_POSITIONS p JOIN TRADE_OPS.CORE.DIM_SECURITY x ON x.security_id = p.security_id
    WHERE p.as_of_date = '2026-11-20' AND p.traded_quantity <> p.settled_quantity
    GROUP BY x.ticker

- id: G24
