- id: G46
  category: reference
  question: Which desks have failed trades?
  sql: |
    SELECT DISTINCT a.desk
    FROM TRADE_OPS.CORE.FACT_TRADES t
    JOIN TRADE_OPS.CORE.FACT_SETTLEMENTS s ON s.trade_id = t.trade_id
    JOIN TRADE_OPS.CORE.DIM_ACCOUNT a ON a.account_id = t.account_id
    WHERE s.settlement_status = 'FAILED'

- id: G47
  category: reference
  question: Fail rate by counterparty this month
  sql: |
    SELECT c.counterparty_name,
           100.0 * SUM(CASE WHEN s.fail_reason IS NOT NULL THEN 1 ELSE 0 END) / COUNT(*)
    FROM TRADE_OPS.CORE.FACT_SETTLEMENTS s
    JOIN TRADE_OPS.CORE.FACT_TRADES t ON t.trade_id = s.trade_id
    JOIN TRADE_OPS.CORE.DIM_COUNTERPARTY c ON c.counterparty_id = t.counterparty_id
    WHERE s.expected_settle_date BETWEEN '2026-11-01' AND '2026-11-20'
    GROUP BY c.counterparty_name

- id: G48
