- id: G18
  category: activity
  question: Which trader booked the most trades this week?
  sql: |
    SELECT trader FROM TRADE_OPS.CORE.FACT_TRADES
    WHERE trade_date BETWEEN '2026-11-16' AND '2026-11-20' AND trade_status <> 'CANCELLED'
