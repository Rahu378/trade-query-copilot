- id: G19
  category: activity
  question: Show the 10 largest trades this week
  sql: |
    SELECT trade_id, notional_usd FROM TRADE_OPS.CORE.FACT_TRADES
    WHERE trade_date BETWEEN '2026-11-16' AND '2026-11-20' AND trade_status <> 'CANCELLED'
