    FROM TRADE_OPS.CORE.FACT_TRADES t JOIN TRADE_OPS.CORE.DIM_ACCOUNT a ON a.account_id = t.account_id
    WHERE t.trade_date BETWEEN '2026-11-16' AND '2026-11-20' AND t.trade_status <> 'CANCELLED'
