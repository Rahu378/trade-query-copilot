# 50-question gold set. Written before the local engine existed and not tuned against.
# SQL is Snowflake dialect against TRADE_OPS.CORE. Columns are the minimum the question needs:
# an answer passes if every gold column shows up in its result (extra columns are fine).
# Dates are relative to the snapshot date 2026-11-20 (a Friday). Weeks run Monday to Friday.
# G05 and G35 were reworded once, before the engine existed, because the original wording had ties in the data.

- id: G01
  category: settlement
  question: Which trades over $1M failed to settle this week, by counterparty?
  sql: |
    SELECT c.counterparty_name, COUNT(*) AS failed_trades
    FROM TRADE_OPS.CORE.FACT_TRADES t
    JOIN TRADE_OPS.CORE.FACT_SETTLEMENTS s ON s.trade_id = t.trade_id
    JOIN TRADE_OPS.CORE.DIM_COUNTERPARTY c ON c.counterparty_id = t.counterparty_id
    WHERE s.settlement_status = 'FAILED' AND t.notional_usd > 1000000
      AND s.expected_settle_date BETWEEN '2026-11-16' AND '2026-11-20'
    GROUP BY c.counterparty_name

- id: G02
  category: settlement
  question: How many trades failed to settle yesterday?
  sql: |
    SELECT COUNT(*) FROM TRADE_OPS.CORE.FACT_SETTLEMENTS s
    WHERE s.settlement_status = 'FAILED' AND s.expected_settle_date = '2026-11-19'

- id: G03
  category: settlement
  question: List all failed trades with their fail reason
  sql: |
    SELECT s.trade_id, s.fail_reason FROM TRADE_OPS.CORE.FACT_SETTLEMENTS s
    WHERE s.settlement_status = 'FAILED'

- id: G04
  category: settlement
  question: What is the total notional of failed trades by fail reason?
  sql: |
    SELECT s.fail_reason, SUM(t.notional_usd)
    FROM TRADE_OPS.CORE.FACT_TRADES t JOIN TRADE_OPS.CORE.FACT_SETTLEMENTS s ON s.trade_id = t.trade_id
    WHERE s.settlement_status = 'FAILED'
    GROUP BY s.fail_reason

- id: G05
  category: settlement
  question: Which counterparty has the highest failed notional?
  sql: |
    SELECT c.counterparty_name
    FROM TRADE_OPS.CORE.FACT_TRADES t
    JOIN TRADE_OPS.CORE.FACT_SETTLEMENTS s ON s.trade_id = t.trade_id
    JOIN TRADE_OPS.CORE.DIM_COUNTERPARTY c ON c.counterparty_id = t.counterparty_id
    WHERE s.settlement_status = 'FAILED'
    GROUP BY c.counterparty_name ORDER BY SUM(t.notional_usd) DESC LIMIT 1

- id: G06
  category: settlement
  question: How many trades are pending settlement?
  sql: |
    SELECT COUNT(*) FROM TRADE_OPS.CORE.FACT_SETTLEMENTS WHERE settlement_status = 'PENDING'

- id: G07
  category: settlement
  question: Show failed trades for Thistle & Crane
  sql: |
    SELECT t.trade_id
    FROM TRADE_OPS.CORE.FACT_TRADES t
    JOIN TRADE_OPS.CORE.FACT_SETTLEMENTS s ON s.trade_id = t.trade_id
    JOIN TRADE_OPS.CORE.DIM_COUNTERPARTY c ON c.counterparty_id = t.counterparty_id
    WHERE s.settlement_status = 'FAILED' AND c.counterparty_name = 'Thistle & Crane'

- id: G08
  category: settlement
  question: What percentage of trades due this month settled on time?
  sql: |
    SELECT 100.0 * SUM(CASE WHEN settlement_status = 'SETTLED' AND actual_settle_date = expected_settle_date
                            THEN 1 ELSE 0 END) / COUNT(*)
    FROM TRADE_OPS.CORE.FACT_SETTLEMENTS
    WHERE expected_settle_date BETWEEN '2026-11-01' AND '2026-11-20'

- id: G09
  category: settlement
  question: Average days failing by counterparty tier
  sql: |
    SELECT c.tier, AVG(s.days_failing)
    FROM TRADE_OPS.CORE.FACT_TRADES t
    JOIN TRADE_OPS.CORE.FACT_SETTLEMENTS s ON s.trade_id = t.trade_id
    JOIN TRADE_OPS.CORE.DIM_COUNTERPARTY c ON c.counterparty_id = t.counterparty_id
    WHERE s.settlement_status = 'FAILED'
    GROUP BY c.tier

- id: G10
  category: settlement
  question: Failed trades over $500k this week
  sql: |
    SELECT t.trade_id
    FROM TRADE_OPS.CORE.FACT_TRADES t JOIN TRADE_OPS.CORE.FACT_SETTLEMENTS s ON s.trade_id = t.trade_id
    WHERE s.settlement_status = 'FAILED' AND t.notional_usd > 500000
      AND s.expected_settle_date BETWEEN '2026-11-16' AND '2026-11-20'

- id: G11
  category: activity
  question: How many trades did we do today?
  sql: |
    SELECT COUNT(*) FROM TRADE_OPS.CORE.FACT_TRADES
    WHERE trade_date = '2026-11-20' AND trade_status <> 'CANCELLED'

- id: G12
  category: activity
  question: Total buy notional by desk this week
  sql: |
    SELECT a.desk, SUM(t.notional_usd)
    FROM TRADE_OPS.CORE.FACT_TRADES t JOIN TRADE_OPS.CORE.DIM_ACCOUNT a ON a.account_id = t.account_id
    WHERE t.side = 'BUY' AND t.trade_date BETWEEN '2026-11-16' AND '2026-11-20' AND t.trade_status <> 'CANCELLED'
